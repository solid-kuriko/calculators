<!DOCTYPE html>
<html>
<head>
<title>SuperDimensional-Worm</title>
<style>
.mini{
    width: 3em;
    max-width: 100%;
}
.big{
    white-space:pre;
    width: 50em;
    max-width: 100%;
}
</style>
</head>
<body>

<h1>超次元虫数列</h1>
<p>
<textarea id="func" type="text" class="big" rows="16">
1,2,3 3
1,2,3,1,3 3
1,2,3,2,3 3
</textarea><br />
<input id="calc" type="button" value="expand"><br /><br />
<textarea id="return" type="text" class="big" rows="8" readonly></textarea>
<script>
function compileSeq(rawSeq){
  let i = rawSeq.indexOf(" ");
  return [rawSeq.slice(0,i).split(",").map((x) => parseInt(x)),parseInt(rawSeq.slice(i+1).replace(/[^0-9]/g,""))];
}

function calcStart(){
  let seqlist = seqtext.value.split("\n");
  let i = seqlist.length-1;
  returnbox.value = "";
  for (let i=0;i<seqlist.length;++i){
    let s,n;
    [s,n] = compileSeq(seqlist[i]);
    if (!isNaN(n)){
      const news = expand(s,n);
      returnbox.value += s+" "+n+"\n=> ";
      returnbox.value += news+"\n";
    }
  }
}

function expand(S,n) {
  function R(s,i,d) {
    return i>=s.length-1 ? 0: R(s,i+1,d) + (s[i]==d ? -1:1);
  }

  function P(s,x,d) {
    for (let i=s.length-1;i>=0;--i){
      if (R(s,i,d) >= x){
        return i;
      }
    }
    return -1;
  }

  function genseq(s,sep) {
    let seq = [];
    let maxR = -1;
    for (let i=s.length-1;i>=0;--i){
      if (R(s,i,sep) > maxR){
        seq.unshift(s[i]);
        ++maxR;
      }
    }
    return seq;
  }

  function pdepth(S, i) {
    return S.length - getp(S,i) - 1;
  }

  function getp(S, i) {
    const ci = i+1;
    if (S[S.length-1] > ci+1){
      return P(S, pdepth(genseq(S,ci),ci),ci);
    }else{
      const wp = P(S,1,ci);
      if (wp>=0){
        return wp-1;
      }else{
        return S.length-2;
      }
    }
  }

  const last = S[S.length-1];
  if (S.length==0 || last==0){
    return S.slice(0, S.length-1);
  }

  let tp;
  if (last > 1){
    tp = P(S, pdepth(genseq(S,0),0),0);
  }else{
    const wp = P(S,1,0);
    if (wp>=0){
      tp = wp-1;
    }else{
      tp = S.length-2;
    }
  }
  
  const B = [last-1].concat(S.slice(tp+1, S.length-1));
  let resultSeq = S.slice(0, S.length-1);
  for (let i=0; i<n; i++) {
    resultSeq = resultSeq.concat(B);
  }

  return resultSeq;
}

var seqtext = document.getElementById("func");
var btn = document.getElementById("calc");
var returnbox = document.getElementById("return");
btn.addEventListener("click",calcStart);
</script>
</body>
</html>
